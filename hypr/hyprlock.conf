# ============================================================
# KAIRII HYPRLOCK
# Matches the custom Kairii SDDM theme
# ============================================================


general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}


# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =
    color = rgb(050507)
}


# ============================================================
# PORTRAIT
# ============================================================

image {
    monitor =

    path = ~/.config/hyprlock/assets/portrait.png

    size = 300

    rounding = -1

    border_size = 0

    position = 0, 170

    halign = center
    valign = center
}


# ============================================================
# TITLE
# ============================================================

label {
    monitor =

    text = ✦ Kairii ✦

    color = rgb(F4D6D9)

    font_size = 42
    font_family = Nunito SemiBold

    position = 0, -25

    halign = center
    valign = center
}


# ============================================================
# SUBTITLE
# ============================================================

label {
    monitor =

    text = おかえり ♡

    color = rgb(D8B7BB)

    font_size = 18
    font_family = Kosugi Maru

    position = 0, -73

    halign = center
    valign = center
}


# ============================================================
# PASSWORD FIELD
# ============================================================

input-field {
    monitor =

    size = 420, 54

    outline_thickness = 1

    dots_size = 0.20
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(59474D)
    inner_color = rgb(171419)

    font_color = rgb(F4D6D9)

    font_family = Nunito

    fade_on_empty = false

    placeholder_text = Password

    hide_input = false

    rounding = -1

    check_color = rgb(F4D6D9)
    fail_color = rgb(E8A6AD)

    fail_text = Incorrect password

    position = 0, -137

    halign = center
    valign = center
}


# ============================================================
# CLOCK
# ============================================================

label {
    monitor =

    text = $TIME12

    color = rgb(806D73)

    font_size = 16
    font_family = Nunito

    position = -38, -30

    halign = right
    valign = top
}


# ============================================================
# FAILED LOGIN MESSAGE
# ============================================================

label {
    monitor =

    text = $FAIL

    color = rgb(E8A6AD)

    font_size = 14
    font_family = Nunito

    position = 0, -185

    halign = center
    valign = center
}